name: 协议扩展提案
description: 对 SKILL.md 协议规范提出扩展或修改
title: "[PROPOSAL] "
labels: [proposal, protocol]
body:
  - type: markdown
    attributes:
      value: |
        ## 协议扩展提案
        感谢你花时间改进 Agent Skill Lifecycle Protocol！
  - type: input
    id: scope
    attributes:
      label: 影响范围
      description: 这个提案影响协议的哪个部分？
      placeholder: 例如：frontmatter 字段、匹配规则、生命周期状态机
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前协议有什么不足？缺少什么能力？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提案方案
      description: 你建议怎么改？请尽量具体（新字段名、行为描述、示例）
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 向后兼容性
      description: 这个改动会破坏现有技能文件吗？如果会，如何迁移？
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已检查现有协议文档，确认该功能尚不支持
          required: true
        - label: 我愿意参与后续讨论和实现
